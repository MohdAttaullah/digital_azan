name: Test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m ruff check app scripts tests
      - run: node --check app/static/app.js
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: for script in deploy/*.sh; do bash -n "$script"; done
      - run: python -m scripts.manage simulate
